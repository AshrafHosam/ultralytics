# Lab 7: install this fork on a clean Ubuntu runner and check the NMS confidence rule on fixed boxes.
name: Lab7 - Deploy and verify

on:
  push:
    branches:
      - semester-investigation
      - 'lab7-*'

permissions:
  contents: read

jobs:
  deploy-and-verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 20  # safety limit for the load experiment
    steps:
      - name: Check out this exact commit
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install CPU-only PyTorch and this fork (from the checked-out code)
        run: |
          python -m pip install --upgrade pip
          pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu
          pip install -e . pytest

      - name: Show which code will run
        run: |
          . /etc/os-release && echo "OS: $PRETTY_NAME"
          echo "Pushed commit:      ${{ github.sha }}"
          echo "Checked-out commit: $(git rev-parse HEAD)"
          python -c "import ultralytics, torch; print('ultralytics', ultralytics.__version__, 'from', ultralytics.__file__); print('torch', torch.__version__)"
          echo "Confidence rule in ultralytics/utils/nms.py:"
          grep -n -E ">=? conf_thres" ultralytics/utils/nms.py

      - name: Run the case and the checks
        run: python -m pytest -v -s tests/test_lab7_nms.py tests/test_python.py::test_nms_end2end_classes_before_max_det

      - name: Measure CPU and memory (baseline b64bae8 vs this commit, same machine)
        run: |
          echo "CPU cores: $(nproc)"
          free -m | head -2
          BASE=b64bae8182a903fee4fa67e44a0d0d4765453a7a
          git fetch --quiet --depth=1 origin $BASE
          for i in 1 2 3; do
            git show $BASE:ultralytics/utils/nms.py > ultralytics/utils/nms.py
            python lab7/measure_nms.py "baseline ${BASE:0:7}, round $i"
            git checkout -- ultralytics/utils/nms.py
            python lab7/measure_nms.py "this commit ${GITHUB_SHA:0:7}, round $i"
          done
