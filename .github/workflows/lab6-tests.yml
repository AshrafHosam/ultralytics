# Lab 6 targeted regression check for the C1 refactoring (ultralytics.cfg.check_cfg).
# Runs on GitHub-hosted runners, CPU only, no model weights or datasets.
name: Lab6 - Tests

on:
  push:
    branches:
      - semester-investigation
      - 'lab6-*'

permissions:
  contents: read

jobs:
  cfg-tests:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out this exact revision
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install CPU-only PyTorch and this fork
        run: |
          python -m pip install --upgrade pip
          pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu
          pip install -e . pytest

      - name: Run the check_cfg tests (characterization test + existing upstream tests)
        run: |
          python -m pytest -v tests/test_lab6_check_cfg.py tests/test_python.py::test_cfg_rejects_fuzzed_values tests/test_exports.py::test_quantize_canonicalization
